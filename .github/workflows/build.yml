name: build
# Exports for Linux and Windows. Runs on main and nightly, not on every PR (cost + noise).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: true
          include-templates: true
      - name: Export
        working-directory: src/IronPipeline.Game
        run: |
          dotnet restore
          godot --headless --import 2>&1 | tail -5
          mkdir -p ../../export/linux ../../export/windows
          godot --headless --export-release "Linux"   ../../export/linux/iron-pipeline.x86_64
          godot --headless --export-release "Windows" ../../export/windows/iron-pipeline.exe
      - uses: actions/upload-artifact@v4
        with:
          name: iron-pipeline-linux
          path: export/linux
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: iron-pipeline-windows
          path: export/windows
          retention-days: 3

  windows-smoke:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iron-pipeline-windows
          path: export/windows
      - name: Launch and quit after 60 frames
        shell: pwsh
        run: |
          $p = Start-Process -FilePath export/windows/iron-pipeline.exe -ArgumentList '--headless','--quit-after','60' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
