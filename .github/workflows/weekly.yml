name: weekly
# Mutation testing is a health metric, not a gate (ADR 0003).
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool install -g dotnet-stryker
      - run: dotnet build src/IronPipeline.Sim.Tests -c Release --nologo
      - name: Stryker on Sim
        working-directory: src/IronPipeline.Sim.Tests
        run: dotnet stryker --project IronPipeline.Sim.csproj --reporter html --reporter markdown --reporter json || true
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: src/IronPipeline.Sim.Tests/StrykerOutput
          retention-days: 30
